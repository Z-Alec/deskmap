name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Check and render the examples
        run: |
          for f in examples/*.yaml; do
            deskmap check "$f"
            deskmap render "$f" -q
          done
      - name: Example diagrams are up to date
        run: git diff --exit-code -- examples/*.svg
