<svg xmlns="http://www.w3.org/2000/svg" width="830" height="646" viewBox="0 0 830 646" font-family="Helvetica, Arial, sans-serif" role="img">
<title>Laptop + one monitor</title>
<rect width="100%" height="100%" fill="white"/>
<text x="70" y="30" font-size="15" font-weight="bold" fill="#1c1917">Laptop + one monitor</text>
<text x="70" y="49" font-size="11" fill="#78716c">1200 x 600 mm · top-down, drawn to scale</text>
<rect x="70" y="106" width="600" height="300" rx="8" fill="#faf7f2" stroke="#a8a29e" stroke-width="1.2"/>
<text x="680" y="118" font-size="10" fill="#78716c">back</text>
<text x="680" y="402" font-size="10" fill="#78716c">front (you)</text>
<rect x="45" y="446" width="635" height="110" rx="10" fill="none" stroke="#d6d3d1" stroke-dasharray="4 4"/>
<text x="80" y="462" font-size="10" fill="#78716c">UNDERNEATH</text>
<text x="666" y="491" font-size="10" fill="#78716c" text-anchor="end">Cable tray — moves with the desk</text>
<path d="M480 303.5 L500 303.5 L500 148.5 L520 148.5 L520 148.5" fill="none" stroke="#ca8a04" stroke-width="1.6" stroke-linejoin="round"><title>laptop → monitor: usb_c</title></path>
<path d="M370 171 L370 482 L391 482 L391 496 L391 496" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linejoin="round"><title>monitor → power_board: power</title></path>
<path d="M560 361 L560 476 L399 476 L399 496 L399 496" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linejoin="round"><title>laptop → power_board: power</title></path>
<rect x="480" y="246" width="160" height="115" rx="6" fill="#d1fae5" stroke="#059669"><title>laptop</title></rect>
<text x="560" y="307.2" font-size="11" font-weight="600" text-anchor="middle" fill="#1c1917">laptop</text>
<rect x="220" y="126" width="300" height="45" rx="6" fill="#d1fae5" stroke="#059669"><title>monitor</title></rect>
<text x="370" y="152.2" font-size="11" font-weight="600" text-anchor="middle" fill="#1c1917">monitor</text>
<rect x="320" y="496" width="150" height="44" rx="6" fill="#e7e5e4" stroke="#57534e"><title>power_board</title></rect>
<text x="395" y="521.7" font-size="11" font-weight="600" text-anchor="middle" fill="#1c1917">power board</text>
<line x1="40" y1="588" x2="62" y2="588" stroke="#ca8a04" stroke-width="2"/>
<text x="68" y="592" font-size="11" fill="#44403c">USB</text>
<line x1="101" y1="588" x2="123" y2="588" stroke="#dc2626" stroke-width="2"/>
<text x="129" y="592" font-size="11" fill="#44403c">Power</text>
<rect x="40" y="604" width="22" height="12" rx="3" fill="#d1fae5" stroke="#059669"/>
<text x="68" y="614" font-size="11" fill="#44403c">laptop</text>
<rect x="132" y="604" width="22" height="12" rx="3" fill="#e7e5e4" stroke="#57534e"/>
<text x="160" y="614" font-size="11" fill="#44403c">Other</text>
</svg>